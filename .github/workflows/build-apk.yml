name: Build Android Debug APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK with Commit SHA
        run: |
          mkdir -p build-output
          cp app/build/outputs/apk/debug/app-debug.apk build-output/UnsentMessenger-debug-${{ github.sha }}.apk
          cp app/build/outputs/apk/debug/app-debug.apk build-output/UnsentMessenger-latest.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnsentMessenger-Debug-APK
          path: build-output/*.apk
          retention-days: 30

      - name: Update 'latest' GitHub Pre-Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Debug Build (${{ github.sha }})"
          body: |
            ### 🤖 Automated CI/CD Build
            - **Commit**: `${{ github.sha }}`
            - **Branch**: `${{ github.ref_name }}`
            - **Triggered by**: `@${{ github.actor }}`

            #### 📲 Download & Install:
            Download **`UnsentMessenger-latest.apk`** below directly on your Android phone to install!
          draft: false
          prerelease: true
          files: build-output/UnsentMessenger-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
